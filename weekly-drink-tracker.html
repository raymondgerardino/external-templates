     ===================================================================== */
  const isNative = typeof window.ReactNativeWebView !== 'undefined';
  let ackCount = 0, ackWaiter = null;

  function postToApp(key, data = null) {
    if (DEMO) { console.log('[demo] →', key, data); return; }
    const text = JSON.stringify({ key, data });
    if (isNative) window.ReactNativeWebView.postMessage(text);
    else window.parent.postMessage(text, '*');
  }

  // REST_REQUEST fields must be top-level (not nested under data) — do not route via postToApp.
  let reqId = 0;
  const pending = {};
  function restRequest(method, model, data, specialParams) {
    return new Promise((resolve, reject) => {
      const id = 'req-' + (++reqId);
      pending[id] = { resolve, reject };
      const text = JSON.stringify({ key: 'REST_REQUEST', method, model, data, id, specialParams: specialParams || null });
      if (isNative) window.ReactNativeWebView.postMessage(text);
      else window.parent.postMessage(text, '*');
    });
  }
  const withTimeout = (p, ms) => Promise.race([p, new Promise((_, rej) => setTimeout(() => rej(new Error('timeout')), ms))]);

  function onMessage(event) {
    try {
      const msg = typeof event.data === 'string' ? JSON.parse(event.data) : event.data;
      if (!msg || !msg.key) return;
      handleMessage(msg);
    } catch (e) { /* ignore non-JSON messages */ }
  }
  document.addEventListener('message', onMessage);   // Android React Native
  window.addEventListener('message', onMessage);     // iOS React Native + web

  const REQUIRED = ['API', 'USER', 'AUTH', 'ACTIVITY', 'ACTIVITY_RESPONSE', 'CONFIG', 'QUESTIONS'];

  function handleMessage(msg) {
    if (msg.key === 'REQUEST_RESPONSE') {
      const p = pending[msg.id];
      if (p) { delete pending[msg.id]; msg.error ? p.reject(new Error(msg.error)) : p.resolve(msg.data); }
      return;
    }
    if (msg.key === 'QUESTION_RESPONSE') { ackCount++; if (ackWaiter) ackWaiter(); return; } // save acknowledgement from the container
    init[msg.key] = msg.data;
    if (!started && REQUIRED.every(k => init[k] !== undefined)) { started = true; startTemplate(); }
  }

  /* =====================================================================
     5. THEME — App theme with platform Settings fallback
     ===================================================================== */
  const FONT_MAP = { LATO: 'Lato', ROBOTO: 'Roboto', OPEN_SANS: 'Open Sans', MONTSERRAT: 'Montserrat', POPPINS: 'Poppins',
    NUNITO: 'Nunito', NUNITO_SANS: 'Nunito Sans', INTER: 'Inter', RALEWAY: 'Raleway', SOURCE_SANS_PRO: 'Source Sans 3',
    MULISH: 'Mulish', WORK_SANS: 'Work Sans', OSWALD: 'Oswald', PT_SANS: 'PT Sans', QUICKSAND: 'Quicksand' };

  async function loadTheme() {
    try {
      const [app, settings] = await Promise.all([
        withTimeout(restRequest('get', 'App', init.ACTIVITY_RESPONSE && init.ACTIVITY_RESPONSE.app), THEME_TIMEOUT_MS).catch(() => ({})),
        withTimeout(restRequest('list', 'Settings', {}), THEME_TIMEOUT_MS).catch(() => ({ items: [] }))
      ]);
      const a = (app && app.theme) || {};
      const s = (settings && settings.items && settings.items[0] && settings.items[0].theme) || {};
      return {
        colors: Object.assign({}, s.colors, a.colors),
        font: a.font || s.font,
        activityHeader: a.activityHeader || s.activityHeader
      };
    } catch (e) { return {}; }
  }

  // --- colour helpers ---
  function hexToRgb(hex) {
    if (!hex || typeof hex !== 'string') return null;
    let h = hex.trim().replace('#', '');
    if (h.length === 3) h = h.split('').map(c => c + c).join('');
    if (!/^[0-9a-f]{6}$/i.test(h)) return null;
    return [parseInt(h.slice(0, 2), 16), parseInt(h.slice(2, 4), 16), parseInt(h.slice(4, 6), 16)];
  }
  function luminance(rgb) {
    const c = rgb.map(v => { v /= 255; return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4); });
    return 0.2126 * c[0] + 0.7152 * c[1] + 0.0722 * c[2];
  }
  const contrast = (a, b) => { const l1 = luminance(a), l2 = luminance(b); return (Math.max(l1, l2) + 0.05) / (Math.min(l1, l2) + 0.05); };
  // White label unless contrast < 4.5:1 (WCAG AA), then black if that reads better.
  function readableOn(hex) {
    const rgb = hexToRgb(hex); if (!rgb) return '#ffffff';
    const w = contrast(rgb, [255, 255, 255]), k = contrast(rgb, [0, 0, 0]);
    return w >= 4.5 ? '#ffffff' : (k > w ? '#000000' : '#ffffff');
  }
  function tint(hex, pct) { // mix with white — reproduces primary/10 and primary/20
    const rgb = hexToRgb(hex); if (!rgb) return null;
    const m = rgb.map(v => Math.round(v * pct + 255 * (1 - pct)));
    return '#' + m.map(v => v.toString(16).padStart(2, '0')).join('');
  }

  function shade(hex, pct) { // mix with black — reproduces Primary/120
    const rgb = hexToRgb(hex); if (!rgb) return null;
    return '#' + rgb.map(v => Math.round(v * pct).toString(16).padStart(2, '0')).join('');
  }

  function applyTheme(theme) {
    const root = document.documentElement.style;
    const c = (theme && theme.colors) || {};
    const primary = hexToRgb(c.primary) ? c.primary : '#613ca8';
    root.setProperty('--primary', primary);
    root.setProperty('--on-primary', readableOn(primary));
    // Tints + button states (Figma › Button States). For the design's own purple the
    // exact Figma values in :root are kept; any other app primary gets them derived.
    if (primary.toLowerCase() !== '#613ca8') {
      const hover = tint(primary, 0.80), pressed = shade(primary, 0.80);
      root.setProperty('--primary-10', tint(primary, 0.10));
      root.setProperty('--primary-20', tint(primary, 0.20));
      root.setProperty('--primary-30', tint(primary, 0.30));
      root.setProperty('--primary-hover', hover);
      root.setProperty('--primary-pressed', pressed);
      root.setProperty('--on-primary-hover', readableOn(hover));
      root.setProperty('--on-primary-pressed', readableOn(pressed));
    }
    if (hexToRgb(c.dark)) root.setProperty('--text-dark', c.dark);
    if (hexToRgb(c.light)) root.setProperty('--bg', c.light);   // success page keeps its fixed #F5F5FB
    const hdr = theme && theme.activityHeader && hexToRgb(theme.activityHeader.color) ? theme.activityHeader.color : '#0a3c64';
    root.setProperty('--header-bg', hdr);
    root.setProperty('--header-fg', readableOn(hdr));
    // App font (falls back to Lato)
    const fam = theme && FONT_MAP[String(theme.font || '').toUpperCase()];
    if (fam && fam !== 'Lato') {
      const link = document.createElement('link');
      link.rel = 'stylesheet';
      link.href = 'https://fonts.googleapis.com/css2?family=' + encodeURIComponent(fam).replace(/%20/g, '+') + ':wght@400;700&display=swap';
      document.head.appendChild(link);
      root.setProperty('--font', `'${fam}', 'Lato', system-ui, sans-serif`);
    }
  }

  /* =====================================================================
     6. DATES & CALCULATIONS
     ===================================================================== */
  // Last 7 days: today-7 … yesterday (furthest date first)
  function buildWeek(now = new Date()) {
    const days = [];
    for (let i = 7; i >= 1; i--) days.push({ date: new Date(now.getFullYear(), now.getMonth(), now.getDate() - i), status: 'empty', items: [] });
    return days;
  }
  const fmt = (d, o) => d.toLocaleDateString('en-GB', o);
  const dayLong = d => fmt(d, { weekday: 'long' }) + ', ' + fmt(d, { day: 'numeric', month: 'long' });
  const weekRange = () => `${fmt(state.days[0].date, { day: 'numeric', month: 'long' })} – ${fmt(state.days[6].date, { day: 'numeric', month: 'long' })}`;

  const round1 = n => Math.round((n + Number.EPSILON) * 10) / 10;
  const itemUnitsExact = it => (it.ml * it.abv / 1000) * it.qty;              // Units = (ml × ABV%) ÷ 1000
  const itemsUnits = items => items.reduce((s, it) => s + itemUnitsExact(it), 0);
  const itemsQty = items => items.reduce((s, it) => s + it.qty, 0);
  const fmtUnits = n => (n === 0 ? '0' : round1(n).toFixed(1));
  const fmtNum = n => String(round1(n)).replace(/\.0$/, '');

  // Items for a day, including the unsaved draft when it is being edited
  const effItems = i => (state.draft && state.draft.dayIndex === i ? state.draft.items : state.days[i].items);
  function effStatus(i) {
    if (state.draft && state.draft.dayIndex === i) return itemsQty(state.draft.items) > 0 ? 'drinks' : (state.days[i].status === 'free' ? 'free' : 'empty');
    return state.days[i].status;
  }
  function weekTotals() {
    let units = 0, qty = 0;
    state.days.forEach((_, i) => { const its = effItems(i); units += itemsUnits(its); qty += itemsQty(its); });
    return { units, qty };
  }
  const allLogged = () => state.days.every(d => d.status !== 'empty');

  /* =====================================================================
     7. RENDERING
     ===================================================================== */
  const $ = id => document.getElementById(id);
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  function render() {
    document.body.classList.toggle('is-success', state.view === 'success');
    document.documentElement.classList.toggle('is-success', state.view === 'success');
    const view = $('view');
    const carousel = view.querySelector('.carousel');
    const carouselX = carousel ? carousel.scrollLeft : 0;

    if (state.view === 'main') view.innerHTML = renderMain();
    else if (state.view === 'track') view.innerHTML = renderTrack();
    else view.innerHTML = renderSuccess();

    // One-shot page transition (consumed here so later re-renders don't replay it)
    if (state.anim) {
      const target = (state.anim === 'next' || state.anim === 'prev') ? view.querySelector('.day-summary') : view.querySelector('.container');
      if (target) target.classList.add('anim-' + state.anim);
      state.anim = null;
    }

    const nc = view.querySelector('.carousel');
    if (nc) { nc.scrollLeft = carouselX; bindCarouselDrag(nc); }

    renderSheet();
    renderModal();
  }

  // ---------- Main view ----------
  function renderMain() {
    const i = state.selected;
    return `
      <div class="container">
        <div class="heading">
          <h1 class="h2">${esc(state.intro.heading)}</h1>
          ${state.intro.description ? `<p class="body-reg">${esc(state.intro.description)}</p>` : ''}
        </div>
        <div class="week-label">${ICON.calendar()}<span>${esc(weekRange())}</span></div>
        <div class="calendar" role="tablist" aria-label="Days to log">${state.days.map(renderDayCell).join('')}</div>
        ${renderDaySummary()}
      </div>`;
  }

  // Everything below the calendar and above the bottom sheet (the swipeable area)
  function renderDaySummary() {
    const day = state.days[state.selected];
    const units = itemsUnits(day.items), qty = itemsQty(day.items);
    return `<section class="day-summary" aria-live="polite" aria-roledescription="swipe left or right to change day">
          <div class="summary-header">
            <p>${esc(dayLong(day.date))}</p>
            ${day.status === 'drinks' ? `<span>${fmtUnits(units)} units</span>` : ''}
          </div>
          <div class="summary-card">${renderSummaryBody(day, units, qty)}</div>
        </section>`;
  }

  function renderDayCell(d, i) {
    const sel = i === state.selected;
    const cls = ['day', sel ? 'is-selected' : '', d.status === 'drinks' ? 'has-drinks' : '', d.status === 'free' ? 'is-free' : '', state.celebrate === i ? 'just-freed' : ''].join(' ');
    let bottom = '', label = 'not logged';
    if (d.status === 'drinks') { const u = fmtUnits(itemsUnits(d.items)); bottom = `<span class="d-units"><b>${u}</b><small>units</small></span>`; label = `${u} units`; }
    if (d.status === 'free') { bottom = `<span class="d-free">Drink free day</span>`; label = 'drink-free day'; }
    return `<button class="${cls}" role="tab" aria-selected="${sel}" data-action="select-day" data-i="${i}" aria-label="${esc(dayLong(d.date))}, ${label}">
        <span class="day-top"><span class="dow">${fmt(d.date, { weekday: 'short' })}</span><span class="dom">${d.date.getDate()}</span></span>
        <span class="day-bottom">${bottom}</span>
      </button>`;
  }

  function renderSummaryBody(day, units, qty) {
    const freeBtn = (done) => `<button class="btn btn-secondary ${done ? 'is-done' : ''}" data-action="mark-free" ${done ? 'disabled aria-disabled="true"' : ''}>Mark as drink-free day</button>`;
    if (day.status === 'drinks') {
      return `<div class="summary-state">${ICON.glass()}<p class="state-title">Drinks added</p>
          <div class="stats"><div><p class="lbl">Total units</p><p class="val">${fmtUnits(units)}</p></div><div><p class="lbl">Total drinks</p><p class="val">${qty}</p></div></div>
        </div>
        <div class="summary-actions"><button class="btn btn-primary" data-action="track">Edit drink</button>${freeBtn(false)}</div>`;
    }
    if (day.status === 'free') {
      const party = state.celebrate === state.selected;
      const sparks = party ? ['#00a88c', 'var(--primary)', '#f39631', '#00a88c', 'var(--primary)', '#f39631', '#00a88c', 'var(--primary)']
        .map((c, k) => `<i class="spark" style="--a:${k * 45}deg;background:${c}"></i>`).join('') : '';
      return `<div class="summary-state ${party ? 'celebrate' : ''}">
          <span class="df-icon">${party ? '<i class="ring"></i>' : ''}${sparks}${ICON.drinkFree()}</span>
          <p class="state-title">Drink-free Day</p><p class="state-sub">Well done!</p>
        </div>
        <div class="summary-actions"><button class="btn btn-primary" data-action="track">Track drink</button>${freeBtn(true)}</div>`;
    }
    return `<div class="summary-state">${ICON.glass()}<p class="empty-text">No drinks added yet</p></div>
      <div class="summary-actions"><button class="btn btn-primary" data-action="track">Track drink</button>${freeBtn(false)}</div>`;
  }

  // ---------- Track drink view ----------
  function renderTrack() {
    const day = state.days[state.draft.dayIndex];
    const cat = catById(state.activeCat);
    const items = state.draft.items;
    const qtyOf = key => (items.find(it => it.key === key) || {}).qty || 0;
    const customs = state.customLibrary.filter(c => c.cat === cat.id);   // remembered across days

    const cards = CATEGORIES.map(c => {
      return `<button class="cat-card ${c.id === cat.id ? 'is-selected' : ''}" style="--cat:${c.color}" data-action="cat" data-cat="${c.id}" aria-pressed="${c.id === cat.id}">
          <span class="cat-tile">${ICON.category(c.icon)}</span>
          <span><span class="cat-name" style="display:block">${esc(c.name)}</span>${c.sub ? `<span class="cat-sub" style="display:block">${esc(c.sub)}</span>` : ''}</span>
        </button>`;
    }).join('');

    const presetRows = cat.sizes.map(([sid, name, ml]) => {
      const key = `${cat.id}_${sid}`;
      return drinkRow({ key, name, meta: `${ml} ml, ${fmtNum(cat.abv)}% ABV`, qty: qtyOf(key), custom: false });
    }).join('');
    const customRows = customs.map(c => drinkRow({ key: c.key, name: c.name, meta: `${c.ml} ml, ${fmtNum(c.abv)}% ABV`, qty: qtyOf(c.key), custom: true })).join('');

    return `
      <div class="container">
        <div class="heading heading--track">
          <h1 class="h2">${esc(dayLong(day.date))}</h1>
          <p class="body-reg">Track your drink on this day</p>
        </div>
        <div class="carousel" role="toolbar" aria-label="Drink categories — swipe for more">${cards}</div>
        <section class="panel" style="--cat:${cat.color}" aria-label="${esc(cat.name)}">
          <div class="panel-head"><h2>${esc(cat.name)}</h2><span>Add how many you had</span></div>
          <div class="drinks">
            ${presetRows}
            ${customRows ? `<p class="custom-label">Your custom drinks</p>${customRows}` : ''}
          </div>
          <button class="add-custom" data-action="open-custom">${ICON.plusLink()}<span>Add a custom drink</span></button>
        </section>
      </div>`;
  }

  // − button + quantity (shown once a drink has been added)
  const stepperLead = (key, name, qty) =>
    `<button class="icon-btn icon-secondary" data-action="dec" data-key="${esc(key)}" aria-label="Remove one ${esc(name)}">${ICON.minusBtn()}</button>` +
    `<span class="qty" aria-live="polite">${qty}</span>`;

  /* In-place update of one drink row after + / −.
     Only the row's highlight, − button and number change — the + button under the
     user's finger, the panel, carousel and heading are left untouched, so rapid
     tapping never redraws the page (which caused a visible jump/flash on phones). */
  function patchDrinkRow(key) {
    const plus = document.querySelector(`.drink-row [data-action="inc"][data-key="${CSS.escape(key)}"]`);
    if (!plus) return;
    const row = plus.closest('.drink-row'), stepper = plus.parentElement;
    const it = state.draft && state.draft.items.find(x => x.key === key);
    const qty = it ? it.qty : 0;
    row.classList.toggle('is-active', qty > 0);
    const minus = stepper.querySelector('[data-action="dec"]'), num = stepper.querySelector('.qty');
    if (qty > 0) {
      if (num) num.textContent = qty;
      else stepper.insertAdjacentHTML('afterbegin', stepperLead(key, plus.dataset.name || '', qty));
    } else {
      const hadFocus = minus && minus === document.activeElement;
      if (minus) minus.remove();
      if (num) num.remove();
      if (hadFocus) plus.focus({ preventScroll: true });   // keyboard users keep their place
    }
  }

  function drinkRow({ key, name, meta, qty, custom }) {
    return `<div class="drink-row ${qty > 0 ? 'is-active' : ''}">
        <div class="drink-text">
          <p class="drink-name">${esc(name)}${custom ? '<span class="tag-custom">Custom</span>' : ''}</p>
          <p class="drink-meta">${esc(meta)}</p>
        </div>
        <div class="stepper">
          ${qty > 0 ? stepperLead(key, name, qty) : ''}
          <button class="icon-btn icon-primary" data-action="inc" data-key="${esc(key)}" data-name="${esc(name)}" aria-label="Add one ${esc(name)}">${ICON.plusBtn()}</button>
        </div>
      </div>`;
  }

  // ---------- Success view ----------
  function renderSuccess() {
    const t = weekTotals();
    return `<div class="success" role="status">
        <div class="success-text">
          <div class="success-badge">${ICON.check()}</div>
          <h1 class="h2 fade-up d1">Record submitted</h1>
          <p class="sub fade-up d1">Your drinks this week have been saved.</p>
        </div>
        <div class="week-label fade-up d2">${ICON.calendar()}<span>${esc(weekRange())}</span></div>
        <div class="success-stats fade-up d3">
          <div class="stat-card"><p class="lbl">Total drinks</p><p class="val">${t.qty}</p></div>
          <div class="stat-card"><p class="lbl">Total units</p><p class="val">${fmtUnits(t.units)}</p></div>
          <div class="stat-card"><p class="lbl">Drink-free days</p><p class="val">${state.days.filter(d => d.status === 'free').length}</p></div>
        </div>
      </div>`;
  }

  // ---------- Bottom sheet ----------
  function renderSheet() {
    const sheet = $('sheet'), scrim = $('scrim'), bar = $('successBar');
    if (state.view === 'success') {
      sheet.hidden = true; scrim.hidden = true;
      bar.hidden = false;
      bar.innerHTML = `<div class="sheet-inner"><div class="action-bar" style="border-top:0"><div class="bar-row"><button class="bar-btn primary" data-action="continue">Continue</button></div></div></div>`;
      measureSheet(bar);
      return;
    }
    bar.hidden = true;
    sheet.hidden = false;
    const body = sheet.querySelector('.sheet-body');
    const bodyScroll = body ? body.scrollTop : 0;
    const t = weekTotals();
    const complete = allLogged();

    let actions;
    if (state.view === 'track') {
      actions = `<div class="bar-row"><button class="bar-btn secondary" data-action="back">Back</button><button class="bar-btn primary" data-action="save">Save</button></div>`;
    } else {
      const busy = state.submitting;
      actions = `<p class="guidance" id="guidance" aria-live="polite">${busy ? 'Saving your week…' : complete ? 'All 7 days logged. You can now submit.' : 'Log all 7 days to enable Submit.'}</p>
        ${state.submitError ? `<p class="inline-error" role="alert">${esc(state.submitError)}</p>` : ''}
        <div class="bar-row"><button class="bar-btn primary ${busy ? 'is-loading' : ''}" data-action="submit" ${complete && !busy ? '' : 'disabled'} aria-describedby="guidance">${busy ? '<span class="btn-spinner" aria-hidden="true"></span>Submitting…' : 'Submit'}</button></div>`;
    }

    sheet.classList.toggle('is-open', state.sheetOpen);
    sheet.innerHTML = `<div class="sheet-inner">
        <button class="sheet-toggle" data-action="sheet-toggle" aria-expanded="${state.sheetOpen}" aria-controls="sheetBody">
          <span class="sheet-handle"><i></i></span>
          <span class="sheet-row">
            <span class="sheet-title"><b>Drinks this week</b><span class="badge">${t.qty}</span></span>
            <span class="sheet-units">${fmtUnits(t.units)} units${ICON.chevron()}</span>
          </span>
        </button>
        <div class="sheet-collapse" id="sheetCollapse" style="height:${state.sheetOpen ? 'auto' : '0px'}" ${state.sheetOpen ? '' : 'inert aria-hidden="true"'}>
          <div class="sheet-body" id="sheetBody">${renderSheetList()}</div>
        </div>
        <div class="action-bar">${actions}</div>
      </div>`;
    clearTimeout(sheetAnimTimer);
    scrim.hidden = !state.sheetOpen;
    scrim.classList.toggle('is-visible', state.sheetOpen);
    const nb = sheet.querySelector('.sheet-body'); if (nb) nb.scrollTop = bodyScroll;
    bindSheetSwipe(sheet.querySelector('.sheet-toggle'));
    measureSheet(sheet);
  }

  // Slide the sheet between collapsed and expanded (animates height + scrim fade)
  let sheetAnimTimer = null;
  function setSheetOpen(open) {
    if (open === state.sheetOpen) return;
    const sheet = $('sheet'), c = $('sheetCollapse'), scrim = $('scrim');
    state.sheetOpen = open;
    if (!c) { renderSheet(); return; }
    clearTimeout(sheetAnimTimer);
    sheet.classList.toggle('is-open', open);
    sheet.querySelector('.sheet-toggle').setAttribute('aria-expanded', open);
    const from = c.getBoundingClientRect().height;
    if (open) { c.inert = false; c.removeAttribute('aria-hidden'); c.style.height = 'auto'; }
    const to = open ? c.scrollHeight : 0;
    c.style.height = from + 'px';
    void c.offsetHeight;                       // force reflow so the transition runs
    c.style.height = to + 'px';
    if (open) { scrim.hidden = false; void scrim.offsetHeight; scrim.classList.add('is-visible'); }
    else scrim.classList.remove('is-visible');
    sheetAnimTimer = setTimeout(() => {        // settle (timer, not transitionend, so reduced-motion works)
      if (state.sheetOpen) c.style.height = 'auto';
      else { c.inert = true; c.setAttribute('aria-hidden', 'true'); scrim.hidden = true; }
    }, SHEET_ANIM_MS + 20);
  }

  function renderSheetList() {
    let html = '';
    state.days.forEach((d, i) => {
      const status = effStatus(i), items = effItems(i).filter(it => it.qty > 0);
      if (status === 'empty') return;
      html += `<p class="sheet-day">${esc(dayLong(d.date))}</p>`;
      if (status === 'free') {
        html += `<div class="sheet-item is-free"><div><p class="t">Drink-free day</p><p class="m">0 drinks · 0 units</p></div>
          <button class="remove-btn" data-action="remove-free" data-i="${i}" aria-label="Clear drink-free day for ${esc(dayLong(d.date))}">${ICON.removeX()}</button></div>`;
        return;
      }
      items.forEach(it => {
        html += `<div class="sheet-item"><div><p class="t">${it.qty}x ${esc(it.name)}${it.custom ? '<span class="tag-custom">Custom</span>' : ''}</p>
            <p class="m">${it.ml} ml · ${fmtNum(it.abv)}% · ${esc(catById(it.cat).name)} · ${fmtUnits(itemUnitsExact(it))} units</p></div>
          <button class="remove-btn" data-action="remove" data-i="${i}" data-key="${esc(it.key)}" aria-label="Remove ${it.qty} ${esc(it.name)}">${ICON.removeX()}</button></div>`;
      });
    });
    return html || `<p class="sheet-empty">No drinks logged yet.</p>`;
  }

  // Keep page content clear of the fixed sheet (collapsed height)
  function measureSheet(el) {
    requestAnimationFrame(() => {
      const body = el.querySelector('.sheet-collapse');
      const h = el.offsetHeight - (body ? body.offsetHeight : 0);
      document.documentElement.style.setProperty('--sheet-h', h + 'px');
    });
  }

  // ---------- Pop-ups ----------
  function renderModal() {
    const root = $('modalRoot');
    const m = state.modal;
    if (!m) { root.innerHTML = ''; return; }
    if (m.type === 'confirm') {
      root.innerHTML = `<div class="overlay" data-action="modal-backdrop"><div class="popup" role="dialog" aria-modal="true" aria-labelledby="mTitle">
          <div class="popup-head"><h2 id="mTitle">${esc(m.title)}</h2><button class="x" data-action="modal-close" aria-label="Close">${ICON.close()}</button></div>
          <p class="body-reg">${esc(m.body)}</p>
          <div class="popup-actions">${m.cancelIsPrimary
            // Safe choice is primary (e.g. leave dialog): [Leave] secondary on the left, [Stay] primary on the right
            ? `<button class="bar-btn secondary" data-action="modal-confirm">${esc(m.confirm)}</button><button class="bar-btn primary" data-action="modal-close">${esc(m.cancel)}</button>`
            : `<button class="bar-btn secondary" data-action="modal-close">${esc(m.cancel)}</button><button class="bar-btn primary" data-action="modal-confirm">${esc(m.confirm)}</button>`}</div>
        </div></div>`;
      return;
    }
    // Custom drink pop-up
    const cat = catById(m.cat);
    const tiles = cat.sizes.map(([sid, name, ml]) => sizeTile(sid, name, ml + 'ml', m.sizeId === sid)).join('') + sizeTile('other', 'Other', 'Custom', m.sizeId === 'other');
    root.innerHTML = `<div class="overlay" data-action="modal-backdrop"><div class="popup" role="dialog" aria-modal="true" aria-labelledby="mTitle">
        <div class="popup-head"><h2 id="mTitle">Add custom ${esc(cat.name.toLowerCase())}</h2><button class="x" data-action="modal-close" aria-label="Close">${ICON.close()}</button></div>
        <div class="field"><p class="field-label">Size</p><div class="size-grid" role="radiogroup" aria-label="Size">${tiles}</div>
          ${m.sizeId === 'other' ? numeric('ml', m.ml, 'ml', 'Volume in millilitres') : ''}</div>
        <div class="field"><p class="field-label">Strength (ABV)</p>${numeric('abv', m.abv, '%', 'Strength, percent ABV')}</div>
        <div class="field"><p class="field-label">Quantity</p>${numeric('qty', m.qty, '', 'Quantity')}</div>
        <div class="popup-actions"><button class="bar-btn primary" id="addCustomBtn" data-action="custom-add" ${customValid() ? '' : 'disabled'}>Add drink</button></div>
      </div></div>`;
  }
  const sizeTile = (sid, name, sub, sel) =>
    `<button class="size-tile ${sel ? 'is-selected' : ''}" role="radio" aria-checked="${sel}" data-action="custom-size" data-size="${sid}"><b>${esc(name)}</b><span>${esc(sub)}</span></button>`;
  const numeric = (field, val, unit, label) =>
    `<div class="numeric">
       <button class="icon-btn icon-secondary" data-action="custom-step" data-field="${field}" data-dir="-1" aria-label="Decrease ${label}">${ICON.minusBtn(40)}</button>
       <div class="val-wrap"><input type="number" inputmode="decimal" data-field="${field}" value="${val}" aria-label="${label}">${unit ? `<span class="unit">${unit}</span>` : ''}</div>
       <button class="icon-btn icon-primary" data-action="custom-step" data-field="${field}" data-dir="1" aria-label="Increase ${label}">${ICON.plusBtn(40)}</button>
     </div>`;

  const CUSTOM_RULES = { ml: { step: 10, min: 0, max: 5000 }, abv: { step: 0.5, min: 0, max: 100 }, qty: { step: 1, min: 0, max: 99 } };
  function customValid() {
    const m = state.modal; if (!m || m.type !== 'custom') return false;
    const ml = m.sizeId === 'other' ? m.ml : 1;
    return m.qty >= 1 && ml > 0 && m.abv >= 0;
  }

  /* =====================================================================
     8. ACTIONS
     ===================================================================== */
  function selectDay(i) {
    if (i === state.selected) return;
    goToDay(i, i > state.selected ? 'next' : 'prev');   // slide in the direction of travel
  }

  /* Change the selected day without redrawing the page: only the two affected calendar
     cells and the day summary (between the calendar and the bottom sheet) are replaced.
     `anim` is 'next' (slides in from the right) or 'prev' (from the left). */
  function goToDay(i, anim) {
    const n = state.days.length;
    i = ((i % n) + n) % n;                               // wrap: last → first, first → last
    if (i === state.selected) return;
    const view = $('view');
    const cal = view.querySelector('.calendar'), summary = view.querySelector('.day-summary');
    const prev = state.selected;
    state.selected = i;
    if (!cal || !summary) { state.anim = anim; render(); return; }
    [prev, i].forEach(k => {
      const cell = cal.querySelector(`.day[data-i="${k}"]`);
      if (cell) cell.outerHTML = renderDayCell(state.days[k], k);
    });
    summary.outerHTML = renderDaySummary();
    const fresh = view.querySelector('.day-summary');
    if (anim) fresh.classList.add('anim-' + anim);
    if (state.submitError) { state.submitError = ''; renderSheet(); }
  }

  function openTrack() {
    const i = state.selected;
    state.draft = { dayIndex: i, items: state.days[i].items.map(it => Object.assign({}, it)) };
    const first = state.draft.items[0];
    state.activeCat = first ? first.cat : 'beer';
    state.view = 'track'; state.sheetOpen = false; state.anim = 'push';
    render(); window.scrollTo(0, 0);
  }

  function changeQty(key, delta) {
    const items = state.draft.items;
    let it = items.find(x => x.key === key);
    if (!it && delta > 0 && key.startsWith('custom|')) {
      const lib = state.customLibrary.find(c => c.key === key);
      if (!lib) return;
      it = Object.assign({}, lib, { qty: 0 });
      items.push(it);
    } else if (!it && delta > 0) {
      const [catId, ...rest] = key.split('_');
      const cat = catById(catId); const size = cat.sizes.find(s => s[0] === rest.join('_'));
      it = { key, cat: cat.id, sizeId: size[0], name: size[1], ml: size[2], abv: cat.abv, qty: 0, custom: false };
      items.push(it);
    }
    if (!it) return;
    it.qty = Math.max(0, Math.min(99, it.qty + delta));
    if (it.qty === 0) items.splice(items.indexOf(it), 1);   // zero = not logged
    patchDrinkRow(key);   // update just this row …
    renderSheet();        // … and the bottom sheet totals (no full page redraw)
  }

  function saveDraft() {
    const d = state.days[state.draft.dayIndex];
    const items = state.draft.items.filter(it => it.qty > 0);
    d.items = items;
    if (items.length) d.status = 'drinks';
    else if (d.status === 'drinks') d.status = 'empty';
    state.draft = null; state.view = 'main'; state.sheetOpen = false; state.anim = 'pop';
    render();   // stay on the same day so the user sees what was logged
    window.scrollTo(0, 0);
  }

  function cancelDraft() { state.draft = null; state.view = 'main'; state.sheetOpen = false; state.anim = 'pop'; render(); window.scrollTo(0, 0); }

  function markFree(i) {
    const d = state.days[i];
    d.status = 'free'; d.items = [];
    state.celebrate = i;            // play the "stamp of approval" once
    render();   // stay on the same day so the user sees the result
    state.celebrate = null;
    try { if (navigator.vibrate) navigator.vibrate(25); } catch (e) { /* haptics are optional */ }
  }

  function removeFromSheet(i, key) {
    if (state.draft && state.draft.dayIndex === i) {
      state.draft.items = state.draft.items.filter(it => it.key !== key);
      patchDrinkRow(key);   // row may be visible in the open panel
      renderSheet();
      return;
    } else {
      const d = state.days[i];
      d.items = d.items.filter(it => it.key !== key);
      if (!d.items.length && d.status === 'drinks') d.status = 'empty';
    }
    render();
  }

  function openCustom() {
    const cat = catById(state.activeCat);
    state.modal = { type: 'custom', cat: cat.id, sizeId: cat.sizes[0][0], ml: 0, abv: cat.abv, qty: 0 };
    renderModal(); focusModal();
  }

  function addCustom() {
    if (!customValid()) return;
    const m = state.modal, cat = catById(m.cat);
    const preset = cat.sizes.find(s => s[0] === m.sizeId);
    const name = preset ? preset[1] : 'Other';
    const ml = preset ? preset[2] : m.ml;
    const abv = round1(m.abv);
    const key = `custom|${cat.id}|${name}|${ml}|${abv}`;
    const existing = state.draft.items.find(it => it.key === key);
    if (existing) existing.qty = Math.min(99, existing.qty + m.qty);
    else state.draft.items.push({ key, cat: cat.id, sizeId: preset ? preset[0] : 'other', name, ml, abv, qty: m.qty, custom: true });
    rememberCustom({ key, cat: cat.id, sizeId: preset ? preset[0] : 'other', name, ml, abv, custom: true });
    state.modal = null; render();
  }

  // Session memory of custom drinks: once created on any day, it is listed on every day
  function rememberCustom(c) {
    if (!state.customLibrary.some(x => x.key === c.key)) state.customLibrary.push({ key: c.key, cat: c.cat, sizeId: c.sizeId, name: c.name, ml: c.ml, abv: c.abv, custom: true });
  }

  function confirm(opts, onOk) { state.modal = Object.assign({ type: 'confirm', cancel: 'Cancel', confirm: 'Confirm' }, opts, { onOk }); renderModal(); focusModal(); }
  function closeModal() { state.modal = null; renderModal(); }
  function focusModal() { const b = document.querySelector('.popup button, .popup input'); if (b) b.focus({ preventScroll: true }); }

  function closeActivity() {
    if (state.submitting) return;   // don't interrupt a save in progress
    if (state.submitted) return quit(true);
    const anyLogged = state.days.some(d => d.status !== 'empty');
    if (!anyLogged) return quit(false);
    confirm({ title: 'Leave without submitting?', body: 'The days you have logged will not be saved.', cancel: 'Stay', confirm: 'Leave', cancelIsPrimary: true }, () => quit(false));
  }

  function quit(complete) {
    if (hasQuit) return; hasQuit = true;
    postToApp('QUIT', complete ? { completeState: 'COMPLETE' } : null);
  }

  /* =====================================================================
     9. SUBMISSION — map questions & build responses
     ===================================================================== */
  const isNumberQ = q => /NUMBER/i.test(q.type || '');
  const isTextQ = q => /TEXT_RESPONSE|SHORT_TEXT|LONG_TEXT/i.test(q.type || '');
  const isContentQ = q => /TEXT_CONTENT/i.test(q.type || '');
  const qLabel = q => String(q.label || q.name || '').trim().toLowerCase();

  // Resolve question indices by Label; fall back to type + order.
  function mapQuestions(questions, overrides) {
    const L = Object.assign({}, QUESTION_LABELS, overrides || {});
    const qs = (questions || []).map((q, index) => ({ q, index }));
    const byLabel = l => qs.find(x => qLabel(x.q) === String(l).toLowerCase());
    const numbers = qs.filter(x => isNumberQ(x.q));
    const texts = qs.filter(x => isTextQ(x.q));
    const multi = byLabel(L.drinksSelected) || qs.find(x => /MULTISELECT/i.test(x.q.type || ''));
    const totalDrinks = byLabel(L.totalDrinks) || numbers[0];
    const totalUnits = byLabel(L.totalUnits) || numbers.find(x => x !== totalDrinks);
    const drinkFreeDays = byLabel(L.drinkFreeDays) || numbers.find(x => x !== totalDrinks && x !== totalUnits);
    let dayQs = (L.days || []).map(byLabel);
    if (dayQs.some(x => !x)) {   // fill gaps with remaining text questions in order
      const used = new Set(dayQs.filter(Boolean));
      const spare = texts.filter(x => !used.has(x));
      dayQs = dayQs.map(x => x || spare.shift()).filter(Boolean);
    }
    // Heading / description: matched by Label; unlabelled TEXT_CONTENT blocks fill any gap in order
    const spareContent = qs.filter(x => isContentQ(x.q) && ![L.heading, L.description].map(l => String(l).toLowerCase()).includes(qLabel(x.q)));
    const heading = byLabel(L.heading) || spareContent.shift();
    const description = byLabel(L.description) || spareContent.shift();
    return { multi, totalDrinks, totalUnits, drinkFreeDays, dayQs, heading, description };
  }

  /* TEXT_CONTENT rich text → plain text lines.
     Formatting is dropped (the template's own type styles are used); line breaks are kept.
     DOMParser never runs scripts, and the result is escaped again when rendered. */
  function contentLines(q) {
    const raw = q && (q.text || q.body);
    if (!raw || typeof raw !== 'string') return [];
    const doc = new DOMParser().parseFromString(`<div>${raw}</div>`, 'text/html');
    const root = doc.body.firstChild;
    root.querySelectorAll('br').forEach(br => br.replaceWith('\n'));
    root.querySelectorAll('p, div, h1, h2, h3, h4, h5, h6, li').forEach(el => el.append('\n'));   // each block ends a line
    return root.textContent.split('\n').map(l => l.replace(/\s+/g, ' ').trim()).filter(Boolean);
  }

  // Heading block → one line (extra lines joined with a space); description block keeps its lines
  function readIntro(qm) {
    const h = contentLines(qm.heading && qm.heading.q);
    const d = contentLines(qm.description && qm.description.q);
    return {
      heading: h.length ? h.join(' ') : DEFAULT_INTRO.heading,
      description: d.length ? d.join('\n') : DEFAULT_INTRO.description
    };
  }

  /* Day summary for the TEXT_RESPONSE. One "-" line per drink, ordered:
       Drink type / Drink size / ABV% / Number logged / Total units (1 dp)
     (the day itself is in the heading line, so it isn't repeated per drink)
     e.g. - Pre-mixed cocktail / Small can 125ml / 6% / 1 qty / 0.8 units total
          - Beer or ale (custom) / Other 200ml / 6.5% / 1 qty / 1.3 units total */
  function daySummaryText(i) {
    const d = state.days[i];
    const u1 = n => round1(n).toFixed(1);                    // always 1 decimal place
    const head = `Day ${i + 1} – ${dayLong(d.date)} ${d.date.getFullYear()}:`;
    if (d.status === 'free') return `${head}\n- Drink-free day / 0 qty / 0.0 units total`;
    // "/" is the field separator, so slashes inside names become "or" (e.g. Bottle/can → Bottle or can)
    const clean = t => String(t).replace(/\s*\/\s*/g, ' or ');
    const lines = d.items.map(it => [
      `${clean(catById(it.cat).name)}${it.custom ? ' (custom)' : ''}`,
      `${clean(it.name)} ${it.ml}ml`,
      `${fmtNum(it.abv)}%`,
      `${it.qty} qty`,
      `${u1(itemUnitsExact(it))} units total`
    ].join(' / '));
    return `${head}\n${lines.map(l => '- ' + l).join('\n')}\nTotal: ${itemsQty(d.items)} drink${itemsQty(d.items) === 1 ? '' : 's'}, ${u1(itemsUnits(d.items))} units`;
  }

  function buildSubmission() {
    const qm = state.questions;
    const t = weekTotals();
    const totalUnits = round1(t.units);
    const duration = Math.round((Date.now() - startedAt) / 1000);
    const responses = [];
    const errors = [];

    // MULTISELECT — every drink type logged this week
    if (qm.multi) {
      const opts = qm.multi.q.options || [];
      const norm = s => String(s || '').toLowerCase().replace(/<[^>]*>/g, '').replace(/[^a-z0-9]+/g, ' ').trim();
      const wanted = new Set();
      state.days.forEach(d => d.items.forEach(it => {
        const cat = catById(it.cat);
        if (it.custom) wanted.add(`${it.cat}_custom|custom`);
        else wanted.add(`${it.cat}_${it.sizeId}|${cat.name} ${it.name}`);
      }));
      const picked = [];
      wanted.forEach(w => {
        const [label, text] = w.split('|');
        const o = opts.find(o => norm(o.label) === norm(label)) ||
                  (label.endsWith('_custom') && opts.find(o => norm(o.label) === 'custom')) ||
                  opts.find(o => norm(o.text) === norm(text));
        if (o && !picked.includes(o)) picked.push(o);
      });
      if (!picked.length) { const none = opts.find(o => ['drink_free', 'none'].includes(String(o.label || '').toLowerCase())); if (none) picked.push(none); }
      responses.push({ index: qm.multi.index, options: picked.map(o => ({ _id: o._id })), duration });
    }

    // NUMBER_RESPONSE — totals (value + text sent for compatibility)
    if (qm.totalDrinks) responses.push({ index: qm.totalDrinks.index, value: t.qty, text: String(t.qty), duration });
    else errors.push('total drinks (number) question');
    if (qm.totalUnits) responses.push({ index: qm.totalUnits.index, value: totalUnits, text: totalUnits.toFixed(1), duration });
    else errors.push('total units (number) question');
    const freeDays = state.days.filter(d => d.status === 'free').length;
    if (qm.drinkFreeDays) responses.push({ index: qm.drinkFreeDays.index, value: freeDays, text: String(freeDays), duration });
    else errors.push('drink-free days (number) question');

    // TEXT_CONTENT — heading + description viewed (no answer; keeps the container's question count complete)
    [qm.heading, qm.description].forEach(x => { if (x) responses.push({ index: x.index, options: [], duration }); });

    // TEXT_RESPONSE — one per day; extra days fold into the last available question
    if (!qm.dayQs.length) errors.push('day summary (text) questions');
    else {
      const texts = state.days.map((_, i) => daySummaryText(i));
      qm.dayQs.forEach((x, k) => {
        const isLast = k === qm.dayQs.length - 1;
        const text = isLast ? texts.slice(k).join('\n\n') : texts[k];
        responses.push({ index: x.index, text, duration });
      });
    }
    return { responses, errors, totals: { drinks: t.qty, units: totalUnits, drinkFreeDays: freeDays } };
  }

  const delay = ms => new Promise(r => setTimeout(r, ms));
  // Resolves once the container has acknowledged `n` saves, or after `maxMs`
  function waitForAcks(n, maxMs) {
    const start = ackCount;
    return new Promise(resolve => {
      const done = () => { ackWaiter = null; clearTimeout(t); resolve(); };
      const t = setTimeout(done, maxMs);
      ackWaiter = () => { if (ackCount - start >= n) done(); };
    });
  }

  async function submit() {
    if (!allLogged() || state.submitted || state.submitting) return;
    let sub;
    try { sub = buildSubmission(); } catch (e) { sub = { errors: ['an unexpected error (' + e.message + ')'] }; }
    if (sub.errors && sub.errors.length) {
      state.submitError = `We couldn't submit: this activity is missing its ${sub.errors.join(', ')}. Please contact the app admin.`;
      postToApp('LOG', { error: state.submitError });
      render(); return;
    }
    // Loading state: spinner on the button while responses are sent and saved
    state.submitting = true; state.submitError = ''; state.sheetOpen = false;
    renderSheet();
    const acks = DEMO ? Promise.resolve() : waitForAcks(sub.responses.length, SUBMIT_ACK_MAX_MS);
    sub.responses.forEach(r => postToApp('QUESTION_RESPONSE', r));
    if (DEMO) console.log('[demo] submission payload', sub);
    await Promise.all([delay(SUBMIT_MIN_MS), acks]);
    state.submitting = false; state.submitted = true; state.view = 'success';
    render(); window.scrollTo(0, 0);
  }

  /* =====================================================================
     10. EVENTS (delegated)
     ===================================================================== */
  let suppressClick = false;
  document.addEventListener('click', (e) => {
    if (suppressClick) { suppressClick = false; e.preventDefault(); return; }
    const el = e.target.closest('[data-action]');
    if (!el || el.disabled) return;
    const a = el.dataset.action;
    const m = state.modal;
    switch (a) {
      case 'close': return closeActivity();
      case 'select-day': return selectDay(+el.dataset.i);
      case 'track': return openTrack();
      case 'mark-free': {
        const i = state.selected;
        if (state.days[i].status === 'drinks') return confirm({ title: 'Mark as drink-free day?', body: `This will remove the drinks you logged for ${dayLong(state.days[i].date)}.` }, () => markFree(i));
        return markFree(i);
      }
      case 'cat': state.activeCat = el.dataset.cat; return render();
      case 'inc': return changeQty(el.dataset.key, 1);
      case 'dec': return changeQty(el.dataset.key, -1);
      case 'open-custom': return openCustom();
      case 'back': return cancelDraft();
      case 'save': return saveDraft();
      case 'sheet-toggle': return setSheetOpen(!state.sheetOpen);
      case 'sheet-close': return setSheetOpen(false);
      case 'remove': return removeFromSheet(+el.dataset.i, el.dataset.key);
      case 'remove-free': state.days[+el.dataset.i].status = 'empty'; return render();
      case 'submit': return submit();
      case 'continue': return quit(true);
      case 'retry': return retryInit();
      case 'modal-backdrop': if (e.target === el) closeModal(); return;
      case 'modal-close': return closeModal();
      case 'modal-confirm': { const ok = m && m.onOk; closeModal(); if (ok) ok(); return; }
      case 'custom-size': m.sizeId = el.dataset.size; return renderModal();
      case 'custom-step': {
        const f = el.dataset.field, r = CUSTOM_RULES[f];
        m[f] = clamp(round1((+m[f] || 0) + r.step * (+el.dataset.dir)), r.min, r.max);
        return renderModal();
      }
      case 'custom-add': return addCustom();
    }
  });

  const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));

  // Typed values in the custom pop-up (no full re-render while typing)
  document.addEventListener('input', (e) => {
    const f = e.target.dataset && e.target.dataset.field;
    if (!f || !state.modal) return;
    const r = CUSTOM_RULES[f];
    let v = parseFloat(e.target.value);
    if (isNaN(v)) v = 0;
    state.modal[f] = clamp(f === 'qty' ? Math.round(v) : v, r.min, r.max);
    const btn = $('addCustomBtn'); if (btn) btn.disabled = !customValid();
  });
  // On commit, tidy the field in place (a re-render here would swallow the tap that caused the blur)
  document.addEventListener('change', (e) => {
    const f = e.target.dataset && e.target.dataset.field;
    if (f && state.modal) e.target.value = state.modal[f];
  });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') { if (state.modal) closeModal(); else if (state.sheetOpen) setSheetOpen(false); }
    // ← / → also move between days on the main page (loops like the swipe)
    if ((e.key === 'ArrowLeft' || e.key === 'ArrowRight') && state.view === 'main' && !state.modal && !state.sheetOpen && !(e.target instanceof HTMLInputElement)) {
      e.preventDefault(); goToDay(state.selected + (e.key === 'ArrowRight' ? 1 : -1), e.key === 'ArrowRight' ? 'next' : 'prev');
    }
  });
  // Block copy / context menu (text selection is disabled in CSS)
  // iOS Safari only shows :active (pressed) styles when a touchstart listener is registered
  document.addEventListener('touchstart', () => {}, { passive: true });

  ['copy', 'cut', 'contextmenu'].forEach(ev => document.addEventListener(ev, e => { if (!(e.target instanceof HTMLInputElement)) e.preventDefault(); }));

  // Carousel: native touch swipe + mouse drag on web
  function bindCarouselDrag(el) {
    let down = false, startX = 0, startLeft = 0, moved = false;
    el.addEventListener('pointerdown', e => { if (e.pointerType !== 'mouse') return; down = true; moved = false; startX = e.clientX; startLeft = el.scrollLeft; });
    el.addEventListener('pointermove', e => {
      if (!down) return;
      const dx = e.clientX - startX;
      if (Math.abs(dx) > 5) { moved = true; el.classList.add('is-dragging'); }
      if (moved) el.scrollLeft = startLeft - dx;
    });
    const end = () => { if (!down) return; down = false; el.classList.remove('is-dragging'); if (moved) suppressClick = true; setTimeout(() => { suppressClick = false; }, 0); };
    el.addEventListener('pointerup', end); el.addEventListener('pointerleave', end);
  }

  // Sheet: swipe up to expand, down to collapse
  /* Main page: swipe left = next day, swipe right = previous day (loops at both ends).
     Listens on the page area below the calendar (down to the bottom sheet, which sits on top);
     only the day summary moves. Locks to an axis after a few px so vertical scrolling is unaffected. */
  function bindDaySwipe() {
    const view = $('view');
    let x0 = null, y0 = 0, dx = 0, axis = null, pid = null, target = null;
    const reset = el => { if (!el) return; el.style.transition = 'transform .2s ease, opacity .2s ease'; el.style.transform = ''; el.style.opacity = ''; };
    view.addEventListener('pointerdown', e => {
      if (state.view !== 'main' || state.modal || state.sheetOpen) return;
      if (e.pointerType === 'mouse' && e.button !== 0) return;
      const cal = view.querySelector('.calendar');
      if (!cal || e.clientY < cal.getBoundingClientRect().bottom) return;   // calendar & above: not swipeable
      x0 = e.clientX; y0 = e.clientY; dx = 0; axis = null; pid = e.pointerId;
      target = view.querySelector('.day-summary');
    });
    view.addEventListener('pointermove', e => {
      if (x0 === null || e.pointerId !== pid || !target) return;
      const mx = e.clientX - x0, my = e.clientY - y0;
      if (!axis) {
        if (Math.abs(mx) < 8 && Math.abs(my) < 8) return;
        axis = Math.abs(mx) > Math.abs(my) ? 'x' : 'y';
        if (axis === 'x') { try { view.setPointerCapture(pid); } catch (err) { /* optional */ } }
      }
      if (axis !== 'x') return;
      dx = mx;
      target.style.transition = 'none';
      target.style.transform = `translateX(${dx * 0.35}px)`;                 // follows the finger with resistance
      target.style.opacity = String(1 - Math.min(Math.abs(dx) / 500, 0.35));
    });
    const end = (e, cancelled) => {
      if (x0 === null || (e && e.pointerId !== pid)) return;
      const horizontal = axis === 'x';
      x0 = null; axis = null;
      if (!horizontal) return;
      suppressClick = true; setTimeout(() => { suppressClick = false; }, 0);   // a swipe is not a tap
      if (!cancelled && Math.abs(dx) >= SWIPE_MIN_PX) goToDay(state.selected + (dx < 0 ? 1 : -1), dx < 0 ? 'next' : 'prev');
      else reset(target);
      target = null;
    };
    view.addEventListener('pointerup', e => end(e, false));
    view.addEventListener('pointercancel', e => end(e, true));
  }

  function bindSheetSwipe(el) {
    if (!el) return;
    let y0 = null;
    el.addEventListener('pointerdown', e => { y0 = e.clientY; });
    el.addEventListener('pointerup', e => {
      if (y0 === null) return;
      const dy = e.clientY - y0; y0 = null;
      if (Math.abs(dy) < 24) return;            // treat as a tap (handled by click)
      suppressClick = true; setTimeout(() => { suppressClick = false; }, 0);
      const open = dy < 0;
      setSheetOpen(open);
    });
  }

  /* =====================================================================
     11. ERRORS & STARTUP
     ===================================================================== */
  function showFatal(title, detail, canRetry) {
    $('skeleton').hidden = true;
    $('sheet').hidden = true; $('scrim').hidden = true;
    const v = $('view'); v.hidden = false;
    v.innerHTML = `<div class="container"><div class="error-box" role="alert"><b>${esc(title)}</b>${esc(detail)}
      ${canRetry ? '<button class="btn btn-primary" data-action="retry">Try again</button>' : ''}</div></div>`;
  }

  let initTimer = null;
  function armInitTimeout() {
    clearTimeout(initTimer);
    initTimer = setTimeout(() => {
      if (started) return;
      const missing = REQUIRED.filter(k => init[k] === undefined);
      postToApp('LOG', { error: 'Init timeout', missing });
      showFatal('This activity could not load.', ' Please check your connection and try again.', true);
    }, INIT_TIMEOUT_MS);
  }
  function retryInit() {
    $('view').hidden = true; $('skeleton').hidden = false;
    postToApp('READY_DYNAMIC_MEDIA'); armInitTimeout();
  }

  window.addEventListener('error', (e) => {
    postToApp('LOG', { error: String(e.message || e) });
    if (!started) showFatal('Something went wrong.', ' Please close the activity and try again.', false);
  });

  async function startTemplate() {
    clearTimeout(initTimer);
    try {
      state.config = Object.assign({}, init.TEMPLATE_VARIATION && init.TEMPLATE_VARIATION.config, init.CONFIG || {});
      state.questions = mapQuestions(init.QUESTIONS, state.config.questionLabels);
      state.intro = readIntro(state.questions);
      if (!DEMO) applyTheme(await loadTheme());
      else applyTheme(DEMO.theme || {});
      state.days = buildWeek();
      if (DEMO && DEMO.prefill) DEMO.prefill(state, CATEGORIES);
      state.days.forEach(d => d.items.forEach(it => { if (it.custom) rememberCustom(it); }));
      $('skeleton').hidden = true;
      $('view').hidden = false;
      render();
      const q = state.questions;
      if (!q.totalDrinks || !q.totalUnits || !q.drinkFreeDays || !q.dayQs.length || !q.heading || !q.description) postToApp('LOG', { warning: 'Question setup incomplete', found: { heading: !!q.heading, description: !!q.description, multi: !!q.multi, totalDrinks: !!q.totalDrinks, totalUnits: !!q.totalUnits, drinkFreeDays: !!q.drinkFreeDays, dayQuestions: q.dayQs.length } });
    } catch (e) {
      postToApp('LOG', { error: e.message });
      showFatal('This activity could not start.', ' ' + e.message, false);
    }
  }

  console.info('Weekly drink tracker', TEMPLATE_VERSION);
  bindDaySwipe();   // #view persists across renders, so the swipe is bound once

  if (DEMO) {
    // Demo: inject mock init data and render synchronously — no loading screen
    Object.assign(init, DEMO.init);
    started = true;
    startTemplate();
  } else {
    window.addEventListener('load', () => { postToApp('READY_DYNAMIC_MEDIA'); armInitTimeout(); });
  }
})();
</script>
</body>
</html>
